[profile.default]
src = "contracts"
script = "script"
test = "test"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "@acp/=contracts/acp/contracts/",
    "forge-std/=lib/forge-std/src/",
    "contracts/=contracts/"
]
